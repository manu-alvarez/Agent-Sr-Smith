name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: python3 scripts/ai/validate-config.py
      - run: python3 scripts/ai/check-context.py
      - run: node --experimental-strip-types scripts/doctor.ts
